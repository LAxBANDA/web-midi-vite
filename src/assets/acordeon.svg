<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Parte derecha (Teclas/Botones) -->
  <rect id="test" x="300" y="50" width="80" height="100" fill="#ddd" stroke="#000" stroke-width="2" />
  <line x1="310" y1="60" x2="370" y2="60" stroke="#000" stroke-width="1" />
  <line x1="310" y1="80" x2="370" y2="80" stroke="#000" stroke-width="1" />
  <line x1="310" y1="100" x2="370" y2="100" stroke="#000" stroke-width="1" />

  <!-- Fuelles -->
  <polygon points="80,50 300,50 300,150 80,150" fill="#ccc" stroke="#000" stroke-width="2" />
  <line x1="100" y1="50" x2="100" y2="150" stroke="#888" stroke-width="1" />
  <line x1="140" y1="50" x2="140" y2="150" stroke="#888" stroke-width="1" />
  <line x1="180" y1="50" x2="180" y2="150" stroke="#888" stroke-width="1" />
  <line x1="220" y1="50" x2="220" y2="150" stroke="#888" stroke-width="1" />
  <line x1="260" y1="50" x2="260" y2="150" stroke="#888" stroke-width="1" />

  <!-- Parte izquierda (Botones) -->
  <rect x="20" y="50" width="60" height="100" fill="#ddd" stroke="#000" stroke-width="2" />
  <circle cx="40" cy="70" r="5" fill="#000" />
  <circle cx="60" cy="70" r="5" fill="#000" />
  <circle cx="40" cy="90" r="5" fill="#000" />
  <circle cx="60" cy="90" r="5" fill="#000" />
  <circle cx="40" cy="110" r="5" fill="#000" />
  <circle cx="60" cy="110" r="5" fill="#000" />
</svg>